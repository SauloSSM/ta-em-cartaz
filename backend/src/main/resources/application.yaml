spring:
  application:
    name: elite-dev-ticket
  profiles:
    default: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
    out-of-order: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${PORT:8080}
auth:
  bcrypt-cost: ${AUTH_BCRYPT_COST:10}
  jwt:
    secret: ${AUTH_JWT_SECRET:}
    ttl: ${AUTH_JWT_TTL:PT8H}
  cors:
    allowed-origins: ${AUTH_CORS_ALLOWED_ORIGINS:}
catalog:
  ticketmaster:
    api-key: ${TICKETMASTER_API_KEY:}
    base-url: ${TICKETMASTER_BASE_URL:https://app.ticketmaster.com/discovery/v2}
    connect-timeout: ${TICKETMASTER_CONNECT_TIMEOUT:PT2S}
    read-timeout: ${TICKETMASTER_READ_TIMEOUT:PT2.5S}
    max-retries: ${TICKETMASTER_MAX_RETRIES:1}
    total-budget: ${TICKETMASTER_TOTAL_BUDGET:PT5S}
management:
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,flyway
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health
