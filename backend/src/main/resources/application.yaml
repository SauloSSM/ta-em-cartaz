spring:
  application:
    name: elite-dev-ticket
  profiles:
    default: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
    out-of-order: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
auth:
  bcrypt-cost: ${AUTH_BCRYPT_COST:10}
  jwt:
    secret: ${AUTH_JWT_SECRET:}
    ttl: ${AUTH_JWT_TTL:PT8H}
  cors:
    allowed-origins: ${AUTH_CORS_ALLOWED_ORIGINS:}
management:
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,flyway
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health
