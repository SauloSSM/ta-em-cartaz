openapi: 3.1.0
info:
  title: Tá em Cartaz API
  version: 1.0.0
  description: >
    API pública e operacional da plataforma Tá em Cartaz.
    Fornece autenticação com cookies seguros e proteção CSRF, pesquisa e descoberta pública de eventos,
    gestão de eventos e setores para organizadores, importação de referências externas do Ticketmaster,
    fluxo de reserva com hold temporário e proteção contra overselling, simulação de pagamentos idempotentes,
    emissão de ingressos com visualização pública segura e validação na portaria via QR Code e código manual.
servers:
  - url: /
    description: Servidor da aplicação Tá em Cartaz
tags:
  - name: Autenticação & Sessão
    description: Gerenciamento de sessão, autenticação com cookie EDT_SESSION e proteção CSRF.
  - name: Catálogo Externo
    description: Consulta e importação de eventos de referência externa (Ticketmaster).
  - name: Eventos Públicos
    description: Descoberta e consulta pública de eventos em cartaz.
  - name: Gestão de Eventos
    description: Criação em rascunho, edição, exclusão e publicação de eventos por organizadores.
  - name: Setores de Ingressos
    description: Configuração de capacidade, preços e setores de ingressos para eventos.
  - name: Reservas
    description: Criação de hold temporal de reserva (10 minutos) com proteção contra overselling e idempotência.
  - name: Pagamentos
    description: Processamento simulado de pagamento com idempotência canônica v1.
  - name: Meus Ingressos
    description: Consulta de ingressos emitidos e confirmados do comprador autenticado.
  - name: Ingresso Público
    description: Visualização pública de ingresso e QR Code via token permanente de compartilhamento.
  - name: Portaria & Validação
    description: Validação segura de ingressos na portaria (manual ou via scanner de QR Code) com idempotência.
paths:
  /api/v1/auth/session:
    get:
      tags:
        - Autenticação & Sessão
      operationId: getAuthSession
      summary: Inicializa ou consulta a sessão atual
      description: Consulta o estado da sessão atual. Sessões sem JWT válido ou expirado retornam authenticated=false (anônima) e emitem o cookie XSRF-TOKEN. Sessões autenticadas retornam os dados do usuário conectado. A resposta nunca expõe tokens sensíveis.
      security:
        - SessionCookie: []
        - {}
      responses:
        '200':
          description: Estado atual da sessão retornado com sucesso.
          headers:
            Set-Cookie:
              description: Cookie XSRF-TOKEN legível pela SPA, SameSite=Lax, Path=/ e Secure em produção.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
  /api/v1/auth/login:
    post:
      tags:
        - Autenticação & Sessão
      operationId: login
      summary: Autentica uma conta provisionada
      description: Autentica um usuário na plataforma Tá em Cartaz. Exige o header X-XSRF-TOKEN correspondente ao cookie XSRF-TOKEN. Emite o cookie EDT_SESSION (HttpOnly) e renova o XSRF-TOKEN.
      security:
        - CsrfCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Conta autenticada com sucesso.
          headers:
            Set-Cookie:
              description: EDT_SESSION HttpOnly e XSRF-TOKEN renovado; SameSite=Lax, Path=/, Secure em produção. EDT_SESSION expira junto com o JWT (TTL padrão PT8H).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedSessionResponse'
        '400':
          $ref: '#/components/responses/AuthInvalidRequest'
        '401':
          $ref: '#/components/responses/AuthInvalidCredentials'
        '403':
          $ref: '#/components/responses/AuthInvalidCsrf'
  /api/v1/auth/logout:
    post:
      tags:
        - Autenticação & Sessão
      operationId: logout
      summary: Encerra a sessão atual
      description: Encerra a sessão do usuário. Operação idempotente para sessão autenticada ou anônima que expira o cookie EDT_SESSION e renova o XSRF-TOKEN.
      security:
        - CsrfCookie: []
          CsrfHeader: []
      responses:
        '204':
          description: Sessão encerrada com sucesso.
          headers:
            Set-Cookie:
              description: EDT_SESSION expirado e XSRF-TOKEN renovado, com os atributos de segurança do ambiente.
              schema:
                type: string
        '403':
          $ref: '#/components/responses/AuthInvalidCsrf'
  /api/v1/catalog/events:
    get:
      tags:
        - Catálogo Externo
      operationId: searchCatalogEvents
      summary: Pesquisa referências de eventos no catálogo Ticketmaster
      description: Requer sessão autenticada com papel ORGANIZER. Consulta o catálogo externo Ticketmaster através do adapter backend com recuperação segura e timeout controlado.
      security:
        - SessionCookie: []
      parameters:
        - name: keyword
          in: query
          required: false
          schema:
            type: string
          description: Palavra-chave opcional para filtrar eventos no catálogo Ticketmaster.
      responses:
        '200':
          description: Lista de referências de eventos retornadas pelo catálogo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogSearchResponse'
        '400':
          $ref: '#/components/responses/AuthInvalidRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '503':
          $ref: '#/components/responses/CatalogUnavailable'
  /api/v1/events:
    get:
      tags:
        - Eventos Públicos
      operationId: listPublicEvents
      summary: Lista e pesquisa eventos públicos publicados
      description: Acesso público sem autenticação. Retorna exclusivamente eventos com status PUBLISHED disponíveis na plataforma Tá em Cartaz. Permite busca textual simples por título.
      security:
        - SessionCookie: []
        - {}
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Termo de busca textual opcional para filtrar eventos publicados por título.
      responses:
        '200':
          description: Lista de eventos publicados recuperada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEventListResponse'
        '400':
          $ref: '#/components/responses/AuthInvalidRequest'
  /api/v1/events/drafts:
    post:
      tags:
        - Gestão de Eventos
      operationId: createDraftEvent
      summary: Cria um novo Event em rascunho (DRAFT) a partir de snapshot
      description: Requer sessão autenticada com papel ORGANIZER e proteção CSRF. Cria um evento interno em rascunho (DRAFT) independente, com identidade própria, a partir de dados manuais ou referência externa.
      security:
        - CsrfCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDraftEventRequest'
      responses:
        '201':
          description: Evento em rascunho criado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          $ref: '#/components/responses/AuthInvalidRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
  /api/v1/events/mine:
    get:
      tags:
        - Gestão de Eventos
      operationId: listMyEvents
      summary: Lista os eventos do Organizer autenticado
      description: Requer sessão autenticada com papel ORGANIZER. Retorna a lista de todos os eventos (DRAFT e PUBLISHED) pertencentes ao organizador conectado.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Lista de eventos do organizador recuperada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
  /api/v1/events/{id}:
    get:
      tags:
        - Gestão de Eventos
      operationId: getEvent
      summary: Consulta os dados de um evento por ID
      description: Acesso público para eventos publicados (PUBLISHED). Se o evento estiver em rascunho (DRAFT), somente o Organizer proprietário pode acessá-lo.
      security:
        - SessionCookie: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador UUID único do evento.
      responses:
        '200':
          description: Dados do evento recuperados com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404':
          $ref: '#/components/responses/EventNotFound'
    put:
      tags:
        - Gestão de Eventos
      operationId: updateDraftEvent
      summary: Atualiza os dados de um evento em rascunho (DRAFT)
      description: Requer sessão autenticada com papel ORGANIZER e proteção CSRF. Permite alterar campos de um evento em DRAFT pertencente ao organizador.
      security:
        - CsrfCookie: []
          CsrfHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador UUID único do evento.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDraftEventRequest'
      responses:
        '200':
          description: Evento atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          $ref: '#/components/responses/AuthInvalidRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '409':
          $ref: '#/components/responses/EventConflict'
    delete:
      tags:
        - Gestão de Eventos
      operationId: deleteDraftEvent
      summary: Exclui um evento em rascunho (DRAFT)
      description: Requer sessão autenticada com papel ORGANIZER e proteção CSRF. Exclui um evento DRAFT pertencente ao organizador. Eventos PUBLISHED não podem ser excluídos.
      security:
        - CsrfCookie: []
          CsrfHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador UUID único do evento.
      responses:
        '204':
          description: Evento em rascunho excluído com sucesso.
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '409':
          $ref: '#/components/responses/EventConflict'
  /api/v1/events/{id}/publish:
    post:
      tags:
        - Gestão de Eventos
      operationId: publishEvent
      summary: Publica um evento em rascunho (DRAFT)
      description: Requer sessão autenticada com papel ORGANIZER e proteção CSRF. Valida todas as pendências mínimas (título, local, data futura, referência externa e pelo menos um setor de ingressos) e transiciona o evento para PUBLISHED de forma transacional.
      security:
        - CsrfCookie: []
          CsrfHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador UUID único do evento.
      responses:
        '200':
          description: Evento publicado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          $ref: '#/components/responses/AuthInvalidRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '409':
          $ref: '#/components/responses/EventConflict'
  /api/v1/events/{eventId}/sectors:
    get:
      tags:
        - Setores de Ingressos
      operationId: listTicketSectors
      summary: Lista os setores de um evento
      description: Acesso público para eventos publicados (PUBLISHED). Se o evento estiver em rascunho (DRAFT), somente o Organizer proprietário pode acessá-lo.
      security:
        - SessionCookie: []
        - {}
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador UUID único do evento.
      responses:
        '200':
          description: Lista de setores do evento recuperada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketSectorListResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404':
          $ref: '#/components/responses/EventNotFound'
    post:
      tags:
        - Setores de Ingressos
      operationId: createTicketSector
      summary: Adiciona um novo setor ao evento em rascunho (DRAFT)
      description: Requer sessão autenticada com papel ORGANIZER e proteção CSRF. Permite adicionar um setor de ingressos a um evento DRAFT pertencente ao organizador.
      security:
        - CsrfCookie: []
          CsrfHeader: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador UUID único do evento.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketSectorRequest'
      responses:
        '201':
          description: Setor criado com sucesso no evento em rascunho.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketSectorResponse'
        '400':
          $ref: '#/components/responses/AuthInvalidRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '409':
          $ref: '#/components/responses/EventConflict'
  /api/v1/events/{eventId}/sectors/{sectorId}:
    put:
      tags:
        - Setores de Ingressos
      operationId: updateTicketSector
      summary: Atualiza os dados de um setor de um evento em rascunho (DRAFT)
      description: Requer sessão autenticada com papel ORGANIZER e proteção CSRF. Permite alterar campos de um setor de um evento em DRAFT pertencente ao organizador.
      security:
        - CsrfCookie: []
          CsrfHeader: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador UUID único do evento.
        - name: sectorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador UUID único do setor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketSectorRequest'
      responses:
        '200':
          description: Setor atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketSectorResponse'
        '400':
          $ref: '#/components/responses/AuthInvalidRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '409':
          $ref: '#/components/responses/EventConflict'
    delete:
      tags:
        - Setores de Ingressos
      operationId: deleteTicketSector
      summary: Exclui um setor de um evento em rascunho (DRAFT)
      description: Requer sessão autenticada com papel ORGANIZER e proteção CSRF. Exclui um setor de um evento DRAFT pertencente ao organizador.
      security:
        - CsrfCookie: []
          CsrfHeader: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador UUID único do evento.
        - name: sectorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador UUID único do setor.
      responses:
        '204':
          description: Setor excluído com sucesso do evento em rascunho.
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '409':
          $ref: '#/components/responses/EventConflict'
  /api/v1/events/{eventId}/sectors/{sectorId}/reservations:
    post:
      tags:
        - Reservas
      operationId: createReservation
      summary: Cria um hold de reserva válido para um cliente autenticado (CUSTOMER)
      description: Requer sessão autenticada com papel CUSTOMER e proteção CSRF. Revalida publicação do evento, vendas abertas, setor e disponibilidade antes de criar o hold com expiração de 10 minutos.
      security:
        - CsrfCookie: []
          CsrfHeader: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador UUID único do evento.
        - name: sectorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador UUID único do setor.
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
          description: Chave de idempotência obrigatória para proteção contra retries e requisições concorrentes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
      responses:
        '201':
          description: Hold de reserva criado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '400':
          $ref: '#/components/responses/AuthInvalidRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404':
          $ref: '#/components/responses/ReservationNotFound'
        '409':
          $ref: '#/components/responses/ReservationConflict'
        '422':
          $ref: '#/components/responses/ReservationUnprocessable'
  /api/v1/reservations/{reservationId}/payments:
    post:
      tags:
        - Pagamentos
      operationId: processPayment
      summary: Processa uma tentativa simulada de pagamento para uma reserva
      description: Requer sessão autenticada com papel CUSTOMER e proteção CSRF. Somente o dono da reserva HOLDING vigente pode realizar a tentativa. O processamento é idempotente por paymentAttemptId com fingerprint v1 canônico.
      security:
        - CsrfCookie: []
          CsrfHeader: []
      parameters:
        - name: reservationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador UUID único da reserva.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessPaymentRequest'
      responses:
        '200':
          description: Tentativa de pagamento processada com sucesso (inclui outcomes DECLINED e APPROVED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          $ref: '#/components/responses/AuthInvalidRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404':
          $ref: '#/components/responses/ReservationNotFound'
        '409':
          $ref: '#/components/responses/ReservationConflict'
        '422':
          $ref: '#/components/responses/ReservationUnprocessable'
  /api/v1/my-tickets:
    get:
      tags:
        - Meus Ingressos
      operationId: listMyTickets
      summary: Lista todos os ingressos pertencentes ao comprador autenticado
      description: Requer sessão autenticada com papel CUSTOMER. Retorna exclusivamente os ingressos do usuário da sessão, ordenados por data de criação decrescente.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Lista de ingressos do cliente recuperada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyTicketListResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
  /api/v1/my-tickets/{ticketId}:
    get:
      tags:
        - Meus Ingressos
      operationId: getMyTicket
      summary: Consulta os detalhes de um ingresso próprio do comprador
      description: Requer sessão autenticada com papel CUSTOMER. Somente o comprador proprietário do ingresso pode acessá-lo. Não-proprietários recebem 404 seguro.
      security:
        - SessionCookie: []
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador UUID único do ingresso.
      responses:
        '200':
          description: Detalhes do ingresso próprio recuperados com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyTicketResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
  /api/v1/public/tickets/{shareToken}:
    get:
      tags:
        - Ingresso Público
      operationId: getPublicTicket
      summary: Consulta pública de um ingresso por shareToken
      description: Acesso público anônimo sem autenticação. Resolve o ingresso exclusivamente pelo shareToken permanente. Não expõe dados pessoais do comprador ou identificadores de reserva. Retorna 404 neutro se o token for inválido ou não existir.
      security:
        - {}
      parameters:
        - name: shareToken
          in: path
          required: true
          schema:
            type: string
          description: Token público permanente de compartilhamento do ingresso.
      responses:
        '200':
          description: Dados públicos do ingresso para apresentação recuperados com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTicketResponse'
        '404':
          $ref: '#/components/responses/TicketNotFound'
  /api/v1/gate/validations:
    post:
      tags:
        - Portaria & Validação
      operationId: validateTicket
      summary: Validação de ingresso na portaria
      description: Requer sessão autenticada com papel GATE e proteção CSRF. Validação atômica e auditável de ingresso por código manual ou token QR no evento selecionado.
      security:
        - CsrfCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateTicketRequest'
      responses:
        '200':
          description: Resultado funcional da validação (VALID, INVALID, ALREADY_USED ou WRONG_EVENT).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateTicketResponse'
        '400':
          $ref: '#/components/responses/GateInvalidRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '409':
          $ref: '#/components/responses/GateConflict'
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: EDT_SESSION
      description: JWT HS256 stateless com claims de sessão; HttpOnly, SameSite=Lax, Path=/ e Secure em produção.
    CsrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: Header com o token CSRF anti-tampering correspondente ao cookie XSRF-TOKEN.
    CsrfCookie:
      type: apiKey
      in: cookie
      name: XSRF-TOKEN
      description: Cookie legível pela SPA para envio no header X-XSRF-TOKEN em requisições de mutação.
