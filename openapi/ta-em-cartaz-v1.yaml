  responses:
    AuthInvalidRequest:
      description: Corpo ausente ou inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AuthUnauthenticated:
      description: Uma operação protegida exige sessão autenticada válida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AuthForbidden:
      description: A sessão autenticada não possui o papel exigido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AuthInvalidCredentials:
      headers:
        Set-Cookie:
          description: EDT_SESSION expirado para eliminar uma sessão existente; HttpOnly, SameSite=Lax, Path=/ e Secure em produção.
          schema:
            type: string
      description: Credenciais inválidas sem revelar se o e-mail existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AuthInvalidCsrf:
      description: Cookie/header CSRF ausente ou divergente; nenhuma mutação é aplicada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    CatalogUnavailable:
      description: Catálogo Ticketmaster temporariamente indisponível ou rate limit excedido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CatalogApiError'
    EventNotFound:
      description: Evento não encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EventApiError'
    EventConflict:
      description: Operação conflitante com o estado atual do evento (ex. tentar excluir ou alterar evento publicado).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EventApiError'
    ReservationNotFound:
      description: Evento, setor ou reserva não encontrada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReservationApiError'
    ReservationConflict:
      description: Conflito de idempotência ou estado conflitante na reserva.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReservationApiError'
    ReservationUnprocessable:
      description: Erro de negócio ao criar reserva (ex. vendas encerradas, esgotado ou evento não publicado).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReservationApiError'
    TicketNotFound:
      description: Ingresso não encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TicketApiError'
    GateInvalidRequest:
      description: Requisição de validação inválida ou malformada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GateApiError'
    GateConflict:
      description: Conflito de tentativa de validação com parâmetros incompatíveis.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GateApiError'
