openapi: 3.1.0
info:
  title: EliteDevTicket API
  version: 1.0.0
  description: Contrato mínimo de autenticação da Story 1.2.
servers:
  - url: /
paths:
  /api/v1/auth/session:
    get:
      operationId: getAuthSession
      summary: Inicializa ou consulta a sessão atual
      description: Um JWT ausente, expirado ou inválido é tratado como sessão anônima. A resposta nunca expõe o JWT e emite o cookie CSRF quando necessário.
      security:
        - SessionCookie: []
        - {}
      responses:
        '200':
          description: Estado atual da sessão.
          headers:
            Set-Cookie:
              description: XSRF-TOKEN legível pela SPA, SameSite=Lax, Path=/ e Secure em demo/prod.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Autentica uma conta provisionada
      description: Exige o header X-XSRF-TOKEN correspondente ao cookie XSRF-TOKEN. Renova sessão e CSRF em caso de sucesso.
      security:
        - CsrfCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Conta autenticada.
          headers:
            Set-Cookie:
              description: EDT_SESSION HttpOnly e XSRF-TOKEN renovado; SameSite=Lax, Path=/, Secure em demo/prod. EDT_SESSION expira junto com o JWT (TTL padrão PT8H).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedSessionResponse'
        '400':
          $ref: '#/components/responses/AuthInvalidRequest'
        '401':
          $ref: '#/components/responses/AuthInvalidCredentials'
        '403':
          $ref: '#/components/responses/AuthInvalidCsrf'
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Encerra a sessão atual
      description: Idempotente para sessão autenticada ou anônima. Expira EDT_SESSION e renova XSRF-TOKEN.
      security:
        - CsrfCookie: []
          CsrfHeader: []
      responses:
        '204':
          description: Sessão encerrada.
          headers:
            Set-Cookie:
              description: EDT_SESSION expirado e XSRF-TOKEN renovado, com os atributos do ambiente.
              schema:
                type: string
        '403':
          $ref: '#/components/responses/AuthInvalidCsrf'
  /api/v1/catalog/events:
    get:
      operationId: searchCatalogEvents
      summary: Pesquisa referências de eventos no catálogo Ticketmaster
      description: Requer sessão autenticada com papel ORGANIZER. Consulta o catálogo externo Ticketmaster através do adapter backend com recuperação segura e orçamento de tempo controlado.
      security:
        - SessionCookie: []
      parameters:
        - name: keyword
          in: query
          required: false
          schema:
            type: string
          description: Palavra-chave opcional para filtrar eventos no catálogo Ticketmaster.
      responses:
        '200':
          description: Lista de referências de eventos retornadas pelo catálogo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogSearchResponse'
        '400':
          $ref: '#/components/responses/AuthInvalidRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '503':
          $ref: '#/components/responses/CatalogUnavailable'
  /api/v1/events/drafts:
    post:
      operationId: createDraftEvent
      summary: Cria um novo Event em rascunho (DRAFT) a partir de snapshot
      description: Requer sessão autenticada com papel ORGANIZER e proteção CSRF. Cria um evento interno DRAFT independente com identidade própria.
      security:
        - CsrfCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDraftEventRequest'
      responses:
        '201':
          description: Evento em rascunho criado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          $ref: '#/components/responses/AuthInvalidRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
  /api/v1/events/mine:
    get:
      operationId: listMyEvents
      summary: Lista os eventos do Organizer autenticado
      description: Requer sessão autenticada com papel ORGANIZER. Retorna a lista de todos os eventos (DRAFT e PUBLISHED) pertencentes ao organizador.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Lista de eventos do organizador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
  /api/v1/events/{id}:
    get:
      operationId: getEvent
      summary: Consulta os dados de um evento por ID
      description: Requer sessão autenticada. Se o evento estiver em DRAFT, somente o Organizer proprietário pode acessá-lo.
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador UUID único do evento.
      responses:
        '200':
          description: Dados do evento recuperados com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404':
          $ref: '#/components/responses/EventNotFound'
    put:
      operationId: updateDraftEvent
      summary: Atualiza os dados de um evento em rascunho (DRAFT)
      description: Requer sessão autenticada com papel ORGANIZER e proteção CSRF. Permite alterar campos de um evento em DRAFT pertencente ao organizador.
      security:
        - CsrfCookie: []
          CsrfHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador UUID único do evento.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDraftEventRequest'
      responses:
        '200':
          description: Evento atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          $ref: '#/components/responses/AuthInvalidRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '409':
          $ref: '#/components/responses/EventConflict'
    delete:
      operationId: deleteDraftEvent
      summary: Exclui um evento em rascunho (DRAFT)
      description: Requer sessão autenticada com papel ORGANIZER e proteção CSRF. Exclui um evento DRAFT pertencente ao organizador. Eventos PUBLISHED não podem ser excluídos.
      security:
        - CsrfCookie: []
          CsrfHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador UUID único do evento.
      responses:
        '204':
          description: Evento em rascunho excluído com sucesso.
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '409':
          $ref: '#/components/responses/EventConflict'
  /api/v1/events/{eventId}/sectors:
    get:
      operationId: listTicketSectors
      summary: Lista os setores de um evento
      description: Requer sessão autenticada. Se o evento estiver em DRAFT, somente o Organizer proprietário pode acessá-lo.
      security:
        - SessionCookie: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador UUID único do evento.
      responses:
        '200':
          description: Lista de setores do evento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketSectorListResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404':
          $ref: '#/components/responses/EventNotFound'
    post:
      operationId: createTicketSector
      summary: Adiciona um novo setor ao evento em rascunho (DRAFT)
      description: Requer sessão autenticada com papel ORGANIZER e proteção CSRF. Permite adicionar um setor a um evento DRAFT pertencente ao organizador.
      security:
        - CsrfCookie: []
          CsrfHeader: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador UUID único do evento.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketSectorRequest'
      responses:
        '201':
          description: Setor criado com sucesso no evento em rascunho.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketSectorResponse'
        '400':
          $ref: '#/components/responses/AuthInvalidRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '409':
          $ref: '#/components/responses/EventConflict'
  /api/v1/events/{eventId}/sectors/{sectorId}:
    put:
      operationId: updateTicketSector
      summary: Atualiza os dados de um setor de um evento em rascunho (DRAFT)
      description: Requer sessão autenticada com papel ORGANIZER e proteção CSRF. Permite alterar campos de um setor de um evento em DRAFT pertencente ao organizador.
      security:
        - CsrfCookie: []
          CsrfHeader: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador UUID único do evento.
        - name: sectorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador UUID único do setor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketSectorRequest'
      responses:
        '200':
          description: Setor atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketSectorResponse'
        '400':
          $ref: '#/components/responses/AuthInvalidRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '409':
          $ref: '#/components/responses/EventConflict'
    delete:
      operationId: deleteTicketSector
      summary: Exclui um setor de um evento em rascunho (DRAFT)
      description: Requer sessão autenticada com papel ORGANIZER e proteção CSRF. Exclui um setor de um evento DRAFT pertencente ao organizador.
      security:
        - CsrfCookie: []
          CsrfHeader: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador UUID único do evento.
        - name: sectorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador UUID único do setor.
      responses:
        '204':
          description: Setor excluído com sucesso do evento em rascunho.
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '409':
          $ref: '#/components/responses/EventConflict'
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: EDT_SESSION
      description: JWT HS256 stateless; HttpOnly, SameSite=Lax, Path=/ e Secure em demo/prod.
    CsrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: Valor do cookie XSRF-TOKEN, que não é HttpOnly e é rotacionado após login/logout.
    CsrfCookie:
      type: apiKey
      in: cookie
      name: XSRF-TOKEN
      description: Cookie legível pela SPA cujo valor deve acompanhar o header X-XSRF-TOKEN.
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
    Role:
      type: string
      enum: [ORGANIZER, CUSTOMER, GATE]
    AuthErrorCode:
      type: string
      enum: [AUTH_INVALID_REQUEST, AUTH_INVALID_CREDENTIALS, AUTH_CSRF_INVALID, AUTH_UNAUTHENTICATED, AUTH_FORBIDDEN]
    CatalogErrorCode:
      type: string
      enum: [CATALOG_UNAVAILABLE, CATALOG_INVALID_REQUEST]
    CatalogEventReference:
      type: object
      additionalProperties: false
      required: [externalId, title]
      properties:
        externalId:
          type: string
        title:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        category:
          type: string
    CatalogSearchResponse:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/CatalogEventReference'
    SessionUser:
      type: object
      additionalProperties: false
      required: [id, email, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
    SessionResponse:
      oneOf:
        - $ref: '#/components/schemas/AnonymousSessionResponse'
        - $ref: '#/components/schemas/AuthenticatedSessionResponse'
    AnonymousSessionResponse:
      type: object
      additionalProperties: false
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
          const: false
    AuthenticatedSessionResponse:
      type: object
      additionalProperties: false
      required: [authenticated, user]
      properties:
        authenticated:
          type: boolean
          const: true
        user:
          $ref: '#/components/schemas/SessionUser'
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, traceId, timestamp]
      properties:
        code:
          $ref: '#/components/schemas/AuthErrorCode'
        message:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        traceId:
          type: string
        timestamp:
          type: string
          format: date-time
    CatalogApiError:
      type: object
      additionalProperties: false
      required: [code, message, traceId, timestamp]
      properties:
        code:
          $ref: '#/components/schemas/CatalogErrorCode'
        message:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        traceId:
          type: string
        timestamp:
          type: string
          format: date-time
    EventStatus:
      type: string
      enum: [DRAFT, PUBLISHED]
    CreateDraftEventRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        externalId:
          type: string
        title:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        category:
          type: string
    EventResponse:
      type: object
      additionalProperties: false
      required: [id, organizerId, title, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        organizerId:
          type: string
          format: uuid
        externalId:
          type: string
        title:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        category:
          type: string
        status:
          $ref: '#/components/schemas/EventStatus'
        venue:
          type: string
        startsAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    EventListResponse:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventResponse'
    UpdateDraftEventRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        category:
          type: string
        venue:
          type: string
        startsAt:
          type: string
          format: date-time
    TicketSectorResponse:
      type: object
      additionalProperties: false
      required: [id, eventId, name, capacity, availableQuantity, price, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        capacity:
          type: integer
        availableQuantity:
          type: integer
        price:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TicketSectorListResponse:
      type: object
      additionalProperties: false
      required: [sectors]
      properties:
        sectors:
          type: array
          items:
            $ref: '#/components/schemas/TicketSectorResponse'
    CreateTicketSectorRequest:
      type: object
      additionalProperties: false
      required: [name, capacity, price]
      properties:
        name:
          type: string
        description:
          type: string
        capacity:
          type: integer
        price:
          type: number
    UpdateTicketSectorRequest:
      type: object
      additionalProperties: false
      required: [name, capacity, price]
      properties:
        name:
          type: string
        description:
          type: string
        capacity:
          type: integer
        price:
          type: number
    EventErrorCode:
      type: string
      enum: [EVENT_NOT_FOUND, EVENT_FORBIDDEN, EVENT_INVALID_REQUEST, EVENT_CANNOT_BE_DELETED, EVENT_CANNOT_BE_MODIFIED]
    EventApiError:
      type: object
      additionalProperties: false
      required: [code, message, traceId, timestamp]
      properties:
        code:
          $ref: '#/components/schemas/EventErrorCode'
        message:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        traceId:
          type: string
        timestamp:
          type: string
          format: date-time
  responses:
    AuthInvalidRequest:
      description: Corpo ausente ou inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AuthUnauthenticated:
      description: Uma operação protegida exige sessão autenticada válida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AuthForbidden:
      description: A sessão autenticada não possui o papel exigido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AuthInvalidCredentials:
      headers:
        Set-Cookie:
          description: EDT_SESSION expirado para eliminar uma sessao existente; HttpOnly, SameSite=Lax, Path=/ e Secure em demo/prod.
          schema:
            type: string
      description: Credenciais inválidas sem revelar se o e-mail existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AuthInvalidCsrf:
      description: Cookie/header CSRF ausente ou divergente; nenhuma mutação é aplicada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    CatalogUnavailable:
      description: Catálogo Ticketmaster temporariamente indisponível ou rate limit excedido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CatalogApiError'
    EventNotFound:
      description: Evento não encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EventApiError'
    EventConflict:
      description: Operação conflitante com o estado atual do evento (ex. tentar excluir ou alterar evento publicado).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EventApiError'
