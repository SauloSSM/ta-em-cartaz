openapi: 3.1.0
info:
  title: EliteDevTicket API
  version: 1.0.0
  description: Contrato mínimo de autenticação da Story 1.2.
servers:
  - url: /
paths:
  /api/v1/auth/session:
    get:
      operationId: getAuthSession
      summary: Inicializa ou consulta a sessão atual
      description: Um JWT ausente, expirado ou inválido é tratado como sessão anônima. A resposta nunca expõe o JWT e emite o cookie CSRF quando necessário.
      security:
        - SessionCookie: []
        - {}
      responses:
        '200':
          description: Estado atual da sessão.
          headers:
            Set-Cookie:
              description: XSRF-TOKEN legível pela SPA, SameSite=Lax, Path=/ e Secure em demo/prod.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Autentica uma conta provisionada
      description: Exige o header X-XSRF-TOKEN correspondente ao cookie XSRF-TOKEN. Renova sessão e CSRF em caso de sucesso.
      security:
        - CsrfCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Conta autenticada.
          headers:
            Set-Cookie:
              description: EDT_SESSION HttpOnly e XSRF-TOKEN renovado; SameSite=Lax, Path=/, Secure em demo/prod. EDT_SESSION expira junto com o JWT (TTL padrão PT8H).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedSessionResponse'
        '400':
          $ref: '#/components/responses/AuthInvalidRequest'
        '401':
          $ref: '#/components/responses/AuthInvalidCredentials'
        '403':
          $ref: '#/components/responses/AuthInvalidCsrf'
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Encerra a sessão atual
      description: Idempotente para sessão autenticada ou anônima. Expira EDT_SESSION e renova XSRF-TOKEN.
      security:
        - CsrfCookie: []
          CsrfHeader: []
      responses:
        '204':
          description: Sessão encerrada.
          headers:
            Set-Cookie:
              description: EDT_SESSION expirado e XSRF-TOKEN renovado, com os atributos do ambiente.
              schema:
                type: string
        '403':
          $ref: '#/components/responses/AuthInvalidCsrf'
  /api/v1/catalog/events:
    get:
      operationId: searchCatalogEvents
      summary: Pesquisa referências de eventos no catálogo Ticketmaster
      description: Requer sessão autenticada com papel ORGANIZER. Consulta o catálogo externo Ticketmaster através do adapter backend com recuperação segura e orçamento de tempo controlado.
      security:
        - SessionCookie: []
      parameters:
        - name: keyword
          in: query
          required: false
          schema:
            type: string
          description: Palavra-chave opcional para filtrar eventos no catálogo Ticketmaster.
      responses:
        '200':
          description: Lista de referências de eventos retornadas pelo catálogo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogSearchResponse'
        '400':
          $ref: '#/components/responses/AuthInvalidRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '503':
          $ref: '#/components/responses/CatalogUnavailable'
  /api/v1/events:
    get:
      operationId: listPublicEvents
      summary: Lista e pesquisa eventos públicos publicados
      description: Acesso público sem autenticação. Retorna exclusivamente eventos com status PUBLISHED. Permite busca textual simples por título.
      security:
        - SessionCookie: []
        - {}
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Termo de busca textual opcional para filtrar eventos publicados por título.
      responses:
        '200':
          description: Lista de eventos publicados recuperada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEventListResponse'
        '400':
          $ref: '#/components/responses/AuthInvalidRequest'
  /api/v1/events/drafts:
    post:
      operationId: createDraftEvent
      summary: Cria um novo Event em rascunho (DRAFT) a partir de snapshot
      description: Requer sessão autenticada com papel ORGANIZER e proteção CSRF. Cria um evento interno DRAFT independente com identidade própria.
      security:
        - CsrfCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDraftEventRequest'
      responses:
        '201':
          description: Evento em rascunho criado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          $ref: '#/components/responses/AuthInvalidRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
  /api/v1/events/mine:
    get:
      operationId: listMyEvents
      summary: Lista os eventos do Organizer autenticado
      description: Requer sessão autenticada com papel ORGANIZER. Retorna a lista de todos os eventos (DRAFT e PUBLISHED) pertencentes ao organizador.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Lista de eventos do organizador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
  /api/v1/events/{id}:
    get:
      operationId: getEvent
      summary: Consulta os dados de um evento por ID
      description: Acesso público para eventos publicados (PUBLISHED). Se o evento estiver em rascunho (DRAFT), somente o Organizer proprietário pode acessá-lo.
      security:
        - SessionCookie: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador UUID único do evento.
      responses:
        '200':
          description: Dados do evento recuperados com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404':
          $ref: '#/components/responses/EventNotFound'
    put:
      operationId: updateDraftEvent
      summary: Atualiza os dados de um evento em rascunho (DRAFT)
      description: Requer sessão autenticada com papel ORGANIZER e proteção CSRF. Permite alterar campos de um evento em DRAFT pertencente ao organizador.
      security:
        - CsrfCookie: []
          CsrfHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador UUID único do evento.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDraftEventRequest'
      responses:
        '200':
          description: Evento atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          $ref: '#/components/responses/AuthInvalidRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '409':
          $ref: '#/components/responses/EventConflict'
    delete:
      operationId: deleteDraftEvent
      summary: Exclui um evento em rascunho (DRAFT)
      description: Requer sessão autenticada com papel ORGANIZER e proteção CSRF. Exclui um evento DRAFT pertencente ao organizador. Eventos PUBLISHED não podem ser excluídos.
      security:
        - CsrfCookie: []
          CsrfHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador UUID único do evento.
      responses:
        '204':
          description: Evento em rascunho excluído com sucesso.
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '409':
          $ref: '#/components/responses/EventConflict'
  /api/v1/events/{id}/publish:
    post:
      operationId: publishEvent
      summary: Publica um evento em rascunho (DRAFT)
      description: Requer sessão autenticada com papel ORGANIZER e proteção CSRF. Valida todas as pendências mínimas (título, local, data futura, referência externa e pelo menos um setor de ingressos) e transiciona o evento para PUBLISHED de forma transacional.
      security:
        - CsrfCookie: []
          CsrfHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador UUID único do evento.
      responses:
        '200':
          description: Evento publicado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          $ref: '#/components/responses/AuthInvalidRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '409':
          $ref: '#/components/responses/EventConflict'
  /api/v1/events/{eventId}/sectors:
    get:
      operationId: listTicketSectors
      summary: Lista os setores de um evento
      description: Acesso público para eventos publicados (PUBLISHED). Se o evento estiver em rascunho (DRAFT), somente o Organizer proprietário pode acessá-lo.
      security:
        - SessionCookie: []
        - {}
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador UUID único do evento.
      responses:
        '200':
          description: Lista de setores do evento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketSectorListResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404':
          $ref: '#/components/responses/EventNotFound'
    post:
      operationId: createTicketSector
      summary: Adiciona um novo setor ao evento em rascunho (DRAFT)
      description: Requer sessão autenticada com papel ORGANIZER e proteção CSRF. Permite adicionar um setor a um evento DRAFT pertencente ao organizador.
      security:
        - CsrfCookie: []
          CsrfHeader: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador UUID único do evento.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketSectorRequest'
      responses:
        '201':
          description: Setor criado com sucesso no evento em rascunho.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketSectorResponse'
        '400':
          $ref: '#/components/responses/AuthInvalidRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '409':
          $ref: '#/components/responses/EventConflict'
  /api/v1/events/{eventId}/sectors/{sectorId}:
    put:
      operationId: updateTicketSector
      summary: Atualiza os dados de um setor de um evento em rascunho (DRAFT)
      description: Requer sessão autenticada com papel ORGANIZER e proteção CSRF. Permite alterar campos de um setor de um evento em DRAFT pertencente ao organizador.
      security:
        - CsrfCookie: []
          CsrfHeader: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador UUID único do evento.
        - name: sectorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador UUID único do setor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketSectorRequest'
      responses:
        '200':
          description: Setor atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketSectorResponse'
        '400':
          $ref: '#/components/responses/AuthInvalidRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '409':
          $ref: '#/components/responses/EventConflict'
    delete:
      operationId: deleteTicketSector
      summary: Exclui um setor de um evento em rascunho (DRAFT)
      description: Requer sessão autenticada com papel ORGANIZER e proteção CSRF. Exclui um setor de um evento DRAFT pertencente ao organizador.
      security:
        - CsrfCookie: []
          CsrfHeader: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador UUID único do evento.
        - name: sectorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador UUID único do setor.
      responses:
        '204':
          description: Setor excluído com sucesso do evento em rascunho.
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '409':
          $ref: '#/components/responses/EventConflict'
  /api/v1/events/{eventId}/sectors/{sectorId}/reservations:
    post:
      operationId: createReservation
      summary: Cria um hold de reserva válido para um cliente autenticado (CUSTOMER)
      description: Requer sessão autenticada com papel CUSTOMER e proteção CSRF. Revalida publicação do evento, vendas abertas, setor e disponibilidade antes de criar o hold com expiração de 10 minutos.
      security:
        - CsrfCookie: []
          CsrfHeader: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador UUID único do evento.
        - name: sectorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador UUID único do setor.
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
          description: Chave de idempotência obrigatória para proteção contra retries e requisições concorrentes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
      responses:
        '201':
          description: Hold de reserva criado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '400':
          $ref: '#/components/responses/AuthInvalidRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404':
          $ref: '#/components/responses/ReservationNotFound'
        '409':
          $ref: '#/components/responses/ReservationConflict'
        '422':
          $ref: '#/components/responses/ReservationUnprocessable'
  /api/v1/reservations/{reservationId}/payments:
    post:
      operationId: processPayment
      summary: Processa uma tentativa simulada de pagamento para uma reserva
      description: Requer sessão autenticada com papel CUSTOMER e proteção CSRF. Somente o dono da reserva HOLDING vigente pode realizar a tentativa. O processamento é idempotente por paymentAttemptId com fingerprint v1 canônico.
      security:
        - CsrfCookie: []
          CsrfHeader: []
      parameters:
        - name: reservationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador UUID único da reserva.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessPaymentRequest'
      responses:
        '200':
          description: Tentativa de pagamento processada com sucesso (inclui outcomes DECLINED e APPROVED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          $ref: '#/components/responses/AuthInvalidRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404':
          $ref: '#/components/responses/ReservationNotFound'
        '409':
          $ref: '#/components/responses/ReservationConflict'
        '422':
          $ref: '#/components/responses/ReservationUnprocessable'
  /api/v1/my-tickets:
    get:
      operationId: listMyTickets
      summary: Lista todos os ingressos pertencentes ao comprador autenticado
      description: Requer sessão autenticada com papel CUSTOMER. Retorna exclusivamente os ingressos do usuário da sessão, ordenados por data de criação decrescente.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Lista de ingressos do cliente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyTicketListResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
  /api/v1/my-tickets/{ticketId}:
    get:
      operationId: getMyTicket
      summary: Consulta os detalhes de um ingresso próprio do comprador
      description: Requer sessão autenticada com papel CUSTOMER. Somente o comprador proprietário do ingresso pode acessá-lo. Não-proprietários recebem 404 seguro.
      security:
        - SessionCookie: []
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador UUID único do ingresso.
      responses:
        '200':
          description: Detalhes do ingresso próprio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyTicketResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: EDT_SESSION
      description: JWT HS256 stateless; HttpOnly, SameSite=Lax, Path=/ e Secure em demo/prod.
    CsrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: Valor do cookie XSRF-TOKEN, que não é HttpOnly e é rotacionado após login/logout.
    CsrfCookie:
      type: apiKey
      in: cookie
      name: XSRF-TOKEN
      description: Cookie legível pela SPA cujo valor deve acompanhar o header X-XSRF-TOKEN.
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
    Role:
      type: string
      enum: [ORGANIZER, CUSTOMER, GATE]
    AuthErrorCode:
      type: string
      enum: [AUTH_INVALID_REQUEST, AUTH_INVALID_CREDENTIALS, AUTH_CSRF_INVALID, AUTH_UNAUTHENTICATED, AUTH_FORBIDDEN]
    CatalogErrorCode:
      type: string
      enum: [CATALOG_UNAVAILABLE, CATALOG_INVALID_REQUEST]
    CatalogEventReference:
      type: object
      additionalProperties: false
      required: [externalId, title]
      properties:
        externalId:
          type: string
        title:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        category:
          type: string
    CatalogSearchResponse:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/CatalogEventReference'
    SessionUser:
      type: object
      additionalProperties: false
      required: [id, email, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
    SessionResponse:
      oneOf:
        - $ref: '#/components/schemas/AnonymousSessionResponse'
        - $ref: '#/components/schemas/AuthenticatedSessionResponse'
    AnonymousSessionResponse:
      type: object
      additionalProperties: false
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
          const: false
    AuthenticatedSessionResponse:
      type: object
      additionalProperties: false
      required: [authenticated, user]
      properties:
        authenticated:
          type: boolean
          const: true
        user:
          $ref: '#/components/schemas/SessionUser'
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, traceId, timestamp]
      properties:
        code:
          $ref: '#/components/schemas/AuthErrorCode'
        message:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        traceId:
          type: string
        timestamp:
          type: string
          format: date-time
    CatalogApiError:
      type: object
      additionalProperties: false
      required: [code, message, traceId, timestamp]
      properties:
        code:
          $ref: '#/components/schemas/CatalogErrorCode'
        message:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        traceId:
          type: string
        timestamp:
          type: string
          format: date-time
    EventStatus:
      type: string
      enum: [DRAFT, PUBLISHED]
    CreateDraftEventRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        externalSource:
          type: string
        externalId:
          type: string
        title:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        category:
          type: string
    EventResponse:
      type: object
      additionalProperties: false
      required: [id, organizerId, title, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        organizerId:
          type: string
          format: uuid
        externalSource:
          type: string
        externalId:
          type: string
        title:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        category:
          type: string
        status:
          $ref: '#/components/schemas/EventStatus'
        venueName:
          type: string
        venueAddress:
          type: string
        startsAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    EventListResponse:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventResponse'
    PublicEventResponse:
      type: object
      additionalProperties: false
      required: [id, title, status, startingPrice, salesClosed, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        category:
          type: string
